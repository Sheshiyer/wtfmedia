name: Research runner

on:
  pull_request:
    paths:
      - "research/**"
      - "cloudflare/src/research*.ts"
      - ".github/workflows/research.yml"
  push:
    paths:
      - "research/**"
      - "cloudflare/src/research*.ts"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  offline-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: research/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y libmagic1 libpango-1.0-0 libpangoft2-1.0-0
      - run: python -m pip install --require-hashes -r research/requirements.lock
      - run: python -m unittest discover -s research/tests -v
